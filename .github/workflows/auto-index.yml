name: Auto Generate Rootless APT Repo Index
on:
  push:
    branches: [ main ]

jobs:
  generate-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ✅【新增：开启UTF-8中文环境，解决你的中文乱码核心】
      - name: Set UTF-8 locale
        run: |
          sudo apt update
          sudo apt install -y locales
          sudo locale-gen zh_CN.UTF-8
          echo "LC_ALL=zh_CN.UTF-8" >> $GITHUB_ENV
          echo "LANG=zh_CN.UTF-8" >> $GITHUB_ENV
          echo "LANGUAGE=zh_CN.UTF-8" >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dpkg-dev, apt-utils & bzip2 gzip
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev apt-utils bzip2 gzip

      - name: Build Packages index
        run: dpkg-scanpackages -m ./debians /dev/null > Packages

      - name: Compress Packages.gz + Packages.bz2
        run: |
          gzip -k -f Packages
          bzip2 -k -f Packages

      - name: Generate Release file (rootless iphoneos-arm64)
        run: |
          apt-ftparchive release . > Release
          echo 'Architectures: iphoneos-arm64' >> Release
          echo 'Components: main' >> Release

      - name: Commit generated index files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add Packages Packages.gz Packages.bz2 Release
          git commit -m "[rootless] update repo index" || echo "No changes to commit"
          git push origin main