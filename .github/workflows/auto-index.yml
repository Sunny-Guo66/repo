name: Auto Generate Rootless APT Repo Index
on:
  push:
    branches: [ master ]

jobs:
  generate-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set UTF-8 locale
        run: |
          sudo apt update
          sudo apt install -y locales dpkg-dev bzip2
          sudo locale-gen zh_CN.UTF-8
          echo "LC_ALL=zh_CN.UTF-8" >> $GITHUB_ENV
          echo "LANG=zh_CN.UTF-8" >> $GITHUB_ENV
          echo "LANGUAGE=zh_CN.UTF-8" >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Packages index
        run: dpkg-scanpackages -m ./debs /dev/null > Packages

      - name: Compress Packages.bz2
        run: bzip2 -k -f Packages

      - name: Generate Release file (rootless iphoneos-arm64)
        run: |
          apt-ftparchive release . > Release
          echo 'Architectures: iphoneos-arm64' >> Release
          echo 'Components: main' >> Release

      - name: Commit generated index files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add Packages Packages.bz2 Release
          git commit -m "[rootless] update repo index" || echo "No changes to commit"
          git push origin master