name: Auto Generate Rootless APT Repo Index
on:
  push:
    branches: [ master ]

jobs:
  generate-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dpkg-dev, apt-utils & bzip2
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev apt-utils bzip2

      - name: Build Packages index
        run: dpkg-scanpackages -m ./debs /dev/null > Packages

      - name: Compress Packages.bz2
        run: bzip2 -k -f Packages

      - name: Generate Release file (rootless iphoneos-arm64)
        run: |
          apt-ftparchive release . > Release
          echo 'Origin: Sunny' >> Release
          echo 'Label: Sunny' >> Release
          echo 'Suite: stable' >> Release
          echo 'Version: 1.0' >> Release
          echo 'Codename: ios' >> Release
          echo 'Description: Sunny 个人Rootless无根插件源，适配iPhone15Pro iOS17.0+' >> Release
          echo 'Architectures: iphoneos-arm64' >> Release
          echo 'Components: main' >> Release

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.bz2 Release
          git commit -m "[Auto] Update repo metadata & index" || echo "Nothing to commit"
          git push