<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件源</title>
    <style>
        body {background:#111;color:#fff;font-family:-apple-system,sans-serif;margin:0;padding:0}
        .container {width:90%;max-width:420px;margin:100px auto;text-align:center}
        .modal-bg {position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:999;display:none}
        .modal {background:#1c1c1e;width:85%;border-radius:14px;padding:24px;text-align:center}
        .modal h3 {margin-top:0}
        .btn {display:block;width:100%;padding:14px;border:none;border-radius:10px;background:#007aff;color:#fff;font-size:17px;margin:8px 0;text-decoration:none;box-sizing:border-box}
        .close-btn {background:#333;}
    </style>
</head>
<body>
    <div class="container">
        <h1>插件源</h1>
        <a class="btn" onclick="openModal()">添加软件源</a>
    </div>

    <div class="modal-bg" id="modal">
        <div class="modal">
            <h3>添加软件源</h3>
            <a class="btn" href="sileo://source/https://sunny-guo66.github.io/repo/">添加软件源到 Sileo</a>
            <a class="btn" href="zbra://sources/add/https://sunny-guo66.github.io/repo/">添加软件源到 Zebra</a>
            <a class="btn" href="cydia://url/https://sunny-guo66.github.io/repo/">添加软件源到 Cydia</a>
            <a class="btn close-btn" onclick="closeModal()">关闭</a>
        </div>
    </div>

    <script>
        function openModal(){
            document.getElementById('modal').style.display='flex';
        }
        function closeModal(){
            document.getElementById('modal').style.display='none';
        }
    </script>
</body>
</html>
